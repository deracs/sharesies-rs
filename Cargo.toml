[package]
name = "sdk"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.5", features = ["json", "cookies"] }
cookie_store = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.117"
thiserror = "1"
async-trait = "0.1"
dotenv = "0.15"
log = "0.4"
env_logger = "0.11.3"
